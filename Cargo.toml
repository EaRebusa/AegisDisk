[package]
name = "aegisdisk"
version = "0.1.2"
edition = "2024"

[lib]
name = "aegisdisk"
path = "src/lib.rs"

[[bin]]
name = "aegisdisk"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
] }
aligned-vec = "0.6"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1.4"
crossbeam-channel = "0.5"
ratatui = "0.29"
crossterm = "0.28"
roaring = "0.12.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
